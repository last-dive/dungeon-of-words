<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon of Words - 文字地牢</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #e8e8e8; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 35px; width: 100%; max-width: 480px; border: 1px solid rgba(255,255,255,0.2); }
        .login-box h1 { text-align: center; margin-bottom: 5px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); font-size: 28px; }
        .login-box .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 13px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #ffd700; }
        .preset-btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .preset-btn { padding: 5px 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; color: #aaa; cursor: pointer; font-size: 10px; }
        .preset-btn:hover { background: rgba(255,215,0,0.2); color: #ffd700; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,215,0,0.4); }
        .btn-secondary { background: linear-gradient(135deg, #4a90d9, #357abd); color: white; margin-top: 10px; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(74,144,217,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .test-result { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
        .test-result.success { background: rgba(0,255,0,0.15); border: 1px solid rgba(0,255,0,0.3); color: #90EE90; }
        .test-result.error { background: rgba(255,0,0,0.15); border: 1px solid rgba(255,0,0,0.3); color: #FFB6C1; }
        
        #game-screen { display: none; }
        .game-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 15px; }
        .game-title { font-size: 20px; color: #ffd700; }
        .game-stats { display: flex; gap: 20px; }
        .stat { text-align: center; }
        .stat-value { font-size: 20px; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 11px; color: #888; }
        
        .map-container { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .map-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .map-cell { aspect-ratio: 1; background: rgba(255,255,255,0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .map-cell.player { background: #ffd700; }
        .map-cell.boss { background: #ff4444; }
        .map-cell.monster { background: #8b4513; }
        .map-cell.treasure { background: #daa520; }
        .map-legend { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #888; }
        
        .status-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .status-card { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 12px; }
        .status-card h3 { font-size: 12px; color: #888; margin-bottom: 5px; }
        .status-card .value { font-size: 16px; font-weight: bold; }
        .hero .value { color: #ffd700; }
        .mage .value { color: #9370db; }
        .boss .value { color: #ff4444; }
        
        .dialogue-container { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px; max-height: 280px; overflow-y: auto; }
        .dialogue { margin-bottom: 10px; padding: 10px; border-radius: 6px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .narrator { background: rgba(255,255,255,0.1); border-left: 3px solid #888; }
        .hero { background: rgba(255,215,0,0.15); border-left: 3px solid #ffd700; }
        .mage { background: rgba(147,112,219,0.15); border-left: 3px solid #9370db; }
        .boss { background: rgba(255,68,68,0.15); border-left: 3px solid #ff4444; }
        .dialogue .speaker { font-weight: bold; font-size: 11px; margin-bottom: 3px; }
        .narrator .speaker { color: #888; }
        .hero .speaker { color: #ffd700; }
        .mage .speaker { color: #9370db; }
        .boss .speaker { color: #ff4444; }
        
        .input-container { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; }
        .input-container textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-size: 14px; resize: vertical; min-height: 60px; font-family: inherit; }
        .input-container textarea:focus { outline: none; border-color: #ffd700; }
        .input-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-action { padding: 10px 14px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .btn-attack { background: linear-gradient(135deg, #ff4444, #cc0000); color: white; }
        .btn-magic { background: linear-gradient(135deg, #9370db, #6a5acd); color: white; }
        .btn-move { background: linear-gradient(135deg, #4a90d9, #357abd); color: white; }
        .btn-custom { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; }
        .btn-action:hover { transform: translateY(-2px); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 30px; border-radius: 16px; text-align: center; border: 2px solid #ffd700; }
        .modal-content h2 { font-size: 28px; margin-bottom: 15px; }
        .victory h2 { color: #ffd700; }
        .defeat h2 { color: #ff4444; }
        .modal-content p { margin-bottom: 20px; color: #aaa; }
        .btn-restart { padding: 12px 30px; background: #ffd700; color: #1a1a2e; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        
        .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #ffd700; animation: spin 1s linear infinite; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1>🏰 Dungeon of Words</h1>
            <p class="subtitle">文字地牢 - AI NPC 文字冒险</p>
            
            <div class="form-group">
                <label>API 提供商</label>
                <select id="api-provider" onchange="onProviderChange()">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic Claude</option>
                    <option value="glm">智谱 GLM</option>
                    <option value="moonshot">月之暗面 Moonshot</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="qwen">阿里 Qwen</option>
                    <option value="custom">自定义 URL</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>API URL</label>
                <input type="text" id="api-url" placeholder="API 地址">
                <div class="preset-btns" id="preset-btns"></div>
            </div>
            
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="api-key" placeholder="sk-...">
            </div>
            
            <div class="form-group">
                <label>模型名称</label>
                <input type="text" id="model-name" placeholder="模型名">
            </div>
            
            <button class="btn btn-secondary" id="test-btn" onclick="testAPI()">🔗 测试连接</button>
            <div class="test-result" id="test-result"></div>
            
            <button class="btn btn-primary" onclick="startGame()" style="margin-top:15px;">开始冒险！</button>
            
            <p style="text-align:center;color:#666;margin-top:15px;font-size:11px;">🔒 API Key 仅保存在浏览器本地</p>
        </div>
    </div>
    
    <div id="game-screen">
        <div class="container">
            <div class="game-header">
                <div class="game-title">🏰 Dungeon of Words</div>
                <div class="game-stats">
                    <div class="stat"><div class="stat-value" id="turn">0</div><div class="stat-label">回合</div></div>
                    <div class="stat"><div class="stat-value" id="steps">50</div><div class="stat-label">剩余</div></div>
                </div>
            </div>
            <div class="map-container">
                <div class="map-grid" id="map"></div>
                <div class="map-legend"><span>🧑勇者</span><span>👹Boss</span><span>👾怪物</span><span>💎宝箱</span></div>
            </div>
            <div class="status-panel">
                <div class="status-card hero"><h3>👤 勇者</h3><div class="value" id="hero-hp">100/100</div></div>
                <div class="status-card mage"><h3>🧙 法师</h3><div class="value" id="mage-mp">50/50</div></div>
                <div class="status-card boss"><h3>👹 Boss</h3><div class="value" id="boss-hp">200/200</div></div>
                <div class="status-card"><h3>👸 公主</h3><div class="value" id="princess-status">被囚禁</div></div>
            </div>
            <div class="dialogue-container" id="dialogue"></div>
            <div class="input-container">
                <textarea id="player-input" placeholder="输入你的行动或对话... (如: 向北走, 攻击, 和法师对话)"></textarea>
                <div class="input-actions">
                    <button class="btn-action btn-attack" onclick="playerAction('attack')">⚔️攻击</button>
                    <button class="btn-action btn-magic" onclick="playerAction('magic')">✨魔法</button>
                    <button class="btn-action btn-move" onclick="playerAction('move')">👣移动</button>
                    <button class="btn-action btn-custom" onclick="playerAction('talk')">💬对话</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content" id="modal-content">
            <h2 id="modal-title">胜利！</h2>
            <p id="modal-msg">你拯救了公主！</p>
            <button class="btn-restart" onclick="restartGame()">再玩一次</button>
        </div>
    </div>

    <script>
    // ==================== API 配置 ====================
    const API_PRESETS = {
        openai: { url: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },
        anthropic: { url: 'https://api.anthropic.com/v1/messages', model: 'claude-3-haiku-20240307' },
        glm: { url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4' },
        moonshot: { url: 'https://api.moonshot.cn/v1/chat/completions', model: 'moonshot-v1-8k' },
        deepseek: { url: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' },
        qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-turbo' },
        custom: { url: '', model: '' }
    };
    
    const PRESET_BUTTONS = {
        openai: [{label:'OpenAI',url:'https://api.openai.com/v1'}],
        anthropic: [{label:'Claude',url:'https://api.anthropic.com/v1'}],
        glm: [{label:'GLM',url:'https://open.bigmodel.cn/api/paas/v4'}],
        moonshot: [{label:'Moonshot',url:'https://api.moonshot.cn/v1'}],
        deepseek: [{label:'DeepSeek',url:'https://api.deepseek.com/v1'}],
        qwen: [{label:'Qwen',url:'https://dashscope.aliyuncs.com/compatible-mode/v1'}],
        custom: [{label:'自定义',url:''}]
    };
    
    // ==================== 游戏配置 ====================
    const CFG = { SIZE: 5, STEPS: 50, HP: 100, MP: 50, BOSS: 200 };
    let state = { provider: 'openai', apiUrl: '', apiKey: '', model: '', turn: 0, steps: CFG.STEPS, player: {x:0,y:0,hp:CFG.HP}, mage: {mp:CFG.MP}, boss: {x:4,y:4,hp:CFG.BOSS}, princess: {x:0,y:0,found:false}, monsters: [], treasures: [], loading: false, over: false };
    
    // ==================== 初始化 ====================
    function onProviderChange() {
        const provider = document.getElementById('api-provider').value;
        const preset = API_PRESETS[provider];
        document.getElementById('api-url').value = preset.url;
        document.getElementById('model-name').value = preset.model;
        
        const btns = PRESET_BUTTONS[provider];
        const btnContainer = document.getElementById('preset-btns');
        btnContainer.innerHTML = btns.map(b => 
            `<button class="preset-btn" onclick="setURL('${b.url}')">${b.label}</button>`
        ).join('');
    }
    
    function setURL(url) { document.getElementById('api-url').value = url; }
    
    // 初始化
    onProviderChange();
    
    // ==================== API 测试 ====================
    async function testAPI() {
        const provider = document.getElementById('api-provider').value;
        const apiUrl = document.getElementById('api-url').value.trim();
        const apiKey = document.getElementById('api-key').value.trim();
        const model = document.getElementById('model-name').value.trim();
        const result = document.getElementById('test-result');
        const testBtn = document.getElementById('test-btn');
        
        if (!apiUrl || !apiKey || !model) {
            result.className = 'test-result error';
            result.textContent = '请填写完整的 API 配置';
            result.style.display = 'block';
            return;
        }
        
        testBtn.disabled = true;
        testBtn.innerHTML = '<span class="loading"></span>测试中...';
        result.style.display = 'none';
        
        try {
            const response = await callAPI(apiUrl, apiKey, model, '你好，请回复"OK"', provider);
            result.className = 'test-result success';
            result.textContent = '✅ 连接成功！API 正常工作';
        } catch (e) {
            result.className = 'test-result error';
            result.textContent = '❌ 连接失败: ' + e.message;
        }
        
        result.style.display = 'block';
        testBtn.disabled = false;
        testBtn.textContent = '🔗 测试连接';
    }
    
    async function callAPI(apiUrl, apiKey, model, prompt, provider) {
        const isAnthropic = provider === 'anthropic';
        
        let headers = { 'Content-Type': 'application/json' };
        let body;
        
        if (isAnthropic) {
            headers['x-api-key'] = apiKey;
            headers['anthropic-version'] = '2023-06-01';
            body = { model: model, max_tokens: 200, messages: [{ role: 'user', content: prompt }] };
        } else if (provider === 'glm') {
            headers['Authorization'] = apiKey;
            body = { model: model, messages: [{ role: 'user', content: prompt }], max_tokens: 500 };
        } else {
            headers['Authorization'] = 'Bearer ' + apiKey;
            body = { model: model, messages: [{ role: 'user', content: prompt }], max_tokens: 500 };
        }
        
        const r = await fetch(apiUrl, { method: 'POST', headers, body: JSON.stringify(body) });
        
        if (!r.ok) {
            const err = await r.text();
            throw new Error('HTTP ' + r.status + ': ' + err.substring(0, 100));
        }
        
        const d = await r.json();
        
        // 解析不同 API 的响应格式
        if (isAnthropic) {
            return d.content?.[0]?.text || '';
        } else {
            // OpenAI / Moonshot / DeepSeek / Qwen / GLM 格式
            let content = d.choices?.[0]?.message?.content || '';
            
            // 如果正式回复为空但思考过程有内容（且不是截断），可以使用思考过程作为回复
            // 这是因为有些模型（如 Moonshot）会把回复放在 reasoning_content
            const finishReason = d.choices?.[0]?.finish_reason;
            if (!content && d.choices?.[0]?.message?.reasoning_content && finishReason !== 'length') {
                content = '[思考中...] ' + d.choices[0].message.reasoning_content;
            }
            
            if (!content) {
                // 返回简要错误信息而不是整个 JSON
                const finishReason = d.choices?.[0]?.finish_reason;
                if (finishReason === 'length') {
                    return '（回复被截断，请重试）';
                }
                return '（AI 未生成有效回复）';
            }
            
            return content;
        }
    }
    
    // ==================== 游戏逻辑 ====================
    function startGame() {
        state.provider = document.getElementById('api-provider').value;
        state.apiUrl = document.getElementById('api-url').value.trim();
        state.apiKey = document.getElementById('api-key').value.trim();
        state.model = document.getElementById('model-name').value.trim();
        
        if (!state.apiUrl || !state.apiKey || !state.model) {
            alert('请填写完整的 API 配置！');
            return;
        }
        
        initMap();
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        add('narrator', '叙事者', '很久以前，公主被黑暗龙王囚禁。作为勇者，你踏上旅程...');
        add('mage', '法师 Merlin', '勇者，我会陪你冒险，提供魔法支援！');
        updateUI();
    }
    
    function initMap() {
        state.turn = 0; state.steps = CFG.STEPS;
        state.player = {x:0,y:0,hp:CFG.HP};
        state.mage = {mp:CFG.MP};
        state.monsters = []; state.treasures = [];
        do { state.boss = {x:2+Math.floor(Math.random()*3),y:2+Math.floor(Math.random()*3),hp:CFG.BOSS}; } while(dist(state.player,state.boss)<3);
        do { state.princess = {x:Math.max(0,Math.min(CFG.SIZE-1,state.boss.x+(Math.random()>.5?1:-1))),y:Math.max(0,Math.min(CFG.SIZE-1,state.boss.y+(Math.random()>.5?1:-1))),found:false}; } while(dist(state.player,state.princess)<2);
        for(let i=0;i<5;i++){let x,y;do{x=Math.floor(Math.random()*CFG.SIZE);y=Math.floor(Math.random()*CFG.SIZE);}while((x==state.player.x&&y==state.player.y)||at(x,y,state.boss)||monAt(x,y));state.monsters.push({x,y,hp:50});}
        for(let i=0;i<4;i++){let x,y;do{x=Math.floor(Math.random()*CFG.SIZE);y=Math.floor(Math.random()*CFG.SIZE);}while((x==state.player.x&&y==state.player.y)||at(x,y,state.boss)||monAt(x,y)||treAt(x,y));state.treasures.push({x,y,o:false});}
    }
    function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
    function at(x,y,o){return o&&o.x===x&&o.y===y;}
    function monAt(x,y){return state.monsters.some(m=>m.x===x&&m.y===y&&m.hp>0);}
    function treAt(x,y){return state.treasures.some(t=>t.x===x&&t.y===y&&!t.o);}
    
    function updateUI(){
        const map=document.getElementById('map');map.innerHTML='';
        for(let y=0;y<CFG.SIZE;y++){for(let x=0;x<CFG.SIZE;x++){const c=document.createElement('div');c.className='map-cell';let e='';
            if(state.player.x===x&&state.player.y===y){c.classList.add('player');e='🧑';}
            else if(at(x,y,state.boss)&&state.boss.hp>0){c.classList.add('boss');e='👹';}
            else if(monAt(x,y)){c.classList.add('monster');e='👾';}
            else if(treAt(x,y)){c.classList.add('treasure');e='💎';}
            c.textContent=e;map.appendChild(c);}}
        document.getElementById('turn').textContent=state.turn;
        document.getElementById('steps').textContent=state.steps;
        document.getElementById('hero-hp').textContent=state.player.hp+'/'+CFG.HP;
        document.getElementById('mage-mp').textContent=state.mage.mp+'/'+CFG.MP;
        document.getElementById('boss-hp').textContent=state.boss.hp+'/'+CFG.BOSS;
        document.getElementById('princess-status').textContent=state.princess.found?'已发现！':'被囚禁';
    }
    
    function add(type,speaker,text){
        const d=document.getElementById('dialogue');
        const div=document.createElement('div');div.className='dialogue '+type;
        div.innerHTML='<div class="speaker">'+speaker+'</div><div class="text">'+text+'</div>';
        d.appendChild(div);d.scrollTop=d.scrollHeight;
    }
    
    function setBtn(dis){
        document.querySelectorAll('.btn-action').forEach(b=>b.disabled=dis);
    }
    
    async function playerAction(act){
        if(state.loading||state.over)return;
        const input=document.getElementById('player-input').value.trim();
        state.loading=true;setBtn(true);
        try{
            state.turn++;state.steps--;
            if(act==='attack'){await doAttack();}
            else if(act==='magic'){await doMagic();}
            else if(act==='move'){await doMove(input);}
            else if(act==='talk'){await doTalk(input);}
            if(state.player.hp<=0){end(false);return;}
            if(state.steps<=0){end(false);return;}
            await npcTurn();
            if(state.player.hp<=0){end(false);return;}
            updateUI();
        }catch(e){add('narrator','错误',e.message);}
        finally{state.loading=false;setBtn(false);}
    }
    
    async function doAttack(){
        const {x,y}=state.player;
        if(at(x,y,state.boss)&&state.boss.hp>0){
            const d=15+Math.floor(Math.random()*16);state.boss.hp-=d;
            add('hero','勇者','攻击Boss！造成'+d+'伤害！');
            if(state.boss.hp<=0){add('narrator','叙事者','Boss倒了！');add('boss','Azathoth','公主在...北塔...（消散）');state.princess.found=true;state.princess.x=state.boss.x;state.princess.y=Math.max(0,state.boss.y-1);}
            else{const bd=15+Math.floor(Math.random()*21);state.player.hp-=bd;add('boss','Azathoth','愚蠢！受死！（'+bd+'伤害）');}
            return;
        }
        const m=state.monsters.find(m=>m.x===x&&m.y===y&&m.hp>0);
        if(m){const d=15+Math.floor(Math.random()*16);m.hp-=d;add('hero','勇者','攻击怪物！'+d+'伤害！');if(m.hp<=0)add('narrator','叙事者','怪物死亡');else{const md=10+Math.floor(Math.random()*16);state.player.hp-=md;add('narrator','叙事者','被反击！-'+md+'HP');}}
        else add('narrator','叙事者','这里没有敌人...');
    }
    
    async function doMagic(){
        if(state.mage.mp<10){add('mage','Merlin','魔力不足...');return;}
        const {x,y}=state.player;
        if(at(x,y,state.boss)&&state.boss.hp>0){const d=20+Math.floor(Math.random()*21);state.boss.hp-=d;state.mage.mp-=10;add('mage','Merlin','火焰魔法！-'+d+'伤害！');if(state.boss.hp<=0){add('narrator','Boss化为灰烬');add('boss','Azathoth','不...可...能...');state.princess.found=true;state.princess.x=state.boss.x;state.princess.y=Math.max(0,state.boss.y-1);}}
        else if(state.player.hp<CFG.HP){const h=20+Math.floor(Math.random()*16);state.player.hp=Math.min(CFG.HP,state.player.hp+h);state.mage.mp-=10;add('mage','Merlin','治疗之光！+'+h+'HP！');}
        else add('mage','Merlin','无需治疗...');
    }
    
    async function doMove(input){
        const ds={'上':{x:0,y:-1},'下':{x:0,y:1},'左':{x:-1,y:0},'右':{x:1,y:0},'北':{x:0,y:-1},'南':{x:0,y:1},'西':{x:-1,y:0},'东':{x:1,y:0}};
        let d=null,dn='';
        for(const[k,v]of Object.entries(ds)){if(input.includes(k)){d=v;dn=k;break;}}
        if(!d){const ks=Object.keys(ds);dn=ks[Math.floor(Math.random()*ks.length)];d=ds[dn];}
        const nx=state.player.x+d.x,ny=state.player.y+d.y;
        if(nx<0||nx>=CFG.SIZE||ny<0||ny>=CFG.SIZE){add('narrator','撞墙了...');return;}
        state.player.x=nx;state.player.y=ny;add('hero','勇者','向'+dn+'移动...');
        await checkTile();
    }
    
    async function checkTile(){
        const {x,y}=state.player;
        if(state.princess.found&&x===state.princess.x&&y===state.princess.y){end(true);return;}
        const m=state.monsters.find(m=>m.x===x&&m.y===y&&m.hp>0);
        if(m){add('narrator','遇到怪物！');const d=15+Math.floor(Math.random()*16);m.hp-=d;add('hero','勇者','攻击！-'+d);if(m.hp<=0)add('narrator','怪物死亡');else{const md=10+Math.floor(Math.random()*16);state.player.hp-=md;add('narrator','被反击！-'+md);}}
        const t=state.treasures.find(t=>t.x===x&&t.y===y&&!t.o);
        if(t){t.o=true;const hp=20+Math.floor(Math.random()*31),mp=10+Math.floor(Math.random()*21);state.player.hp=Math.min(CFG.HP,state.player.hp+hp);state.mage.mp=Math.min(CFG.MP,state.mage.mp+mp);add('narrator','发现宝箱！+'+hp+'HP +'+mp+'MP');}
    }
    
    async function npcTurn(){
        if(state.boss.hp>0&&dist(state.player,state.boss)===0){
            const d=15+Math.floor(Math.random()*21);state.player.hp-=d;
            add('boss','Azathoth','接受黑暗吧！-'+d+'HP');
        }
    }
    
    async function doTalk(input){
        if(!input){add('narrator','说点什么吧...');return;}
        add('hero','勇者',input);
        const npcs=[];
        if(state.boss.hp>0&&dist(state.player,state.boss)<=1)npcs.push('boss');
        if(dist(state.player,{x:0,y:0})<=1)npcs.push('mage');
        if(state.princess.found&&state.player.x===state.princess.x&&state.player.y===state.princess.y)npcs.push('princess');
        if(npcs.length===0){add('narrator','附近没有人可以对话...');return;}
        const npc=npcs[Math.floor(Math.random()*npcs.length)];
        let prompt='',name='';
        if(npc==='boss'){prompt='你是黑暗龙王Azathoth，傲慢残忍。玩家说：「'+input+'」用角色语气简短回复1-2句。';name='Azathoth';}
        else if(npc==='mage'){prompt='你是法师Merlin，忠诚友善。玩家说：「'+input+'」用角色语气回复，给出建议1-2句。';name='Merlin';}
        else{prompt='你是公主Elara，温柔勇敢。玩家说：「'+input+'」用角色语气回复1-2句。';name='公主Elara';}
        try{const resp=await callAPI(state.apiUrl,state.apiKey,state.model,prompt,state.provider);add(npc==='boss'?'boss':npc==='mage'?'mage':'princess',name,resp);}
        catch(e){add('narrator','对话失败:'+e.message);}
    }
    
    function end(win){
        state.over=true;
        const m=document.getElementById('modal'),c=document.getElementById('modal-content');
        c.className='modal-content '+(win?'victory':'defeat');
        document.getElementById('modal-title').textContent=win?'🎉胜利！':'💀失败';
        document.getElementById('modal-msg').textContent=win?'你成功拯救了公主！':'公主没有被拯救...';
        m.classList.add('show');
    }
    
    function restartGame(){
        document.getElementById('modal').classList.remove('show');
        document.getElementById('game-screen').style.display='none';
        document.getElementById('login-screen').style.display='flex';
        document.getElementById('dialogue').innerHTML='';
    }
    </script>
</body>
</html>
